services:
  softioc:
    image: codecr.jlab.org/acc/iac/containers/softioc:1
    hostname: softioc
    container_name: softioc
    environment:
      SOFTIOC_HEALTH_PV: channel1
    volumes:
      - ./examples/softioc-db:/db
      - ./examples/softioc-scripts:/scripts

  epics2web:
    image: jeffersonlab/epics2web:2.1.0
    hostname: epics2web
    container_name: epics2web
    environment:
      EPICS_CA_ADDR_LIST: softioc
    ports:
      - 9090:8080
